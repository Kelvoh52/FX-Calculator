<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelvoh Trades Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="panel calculator-panel">
        <div class="display-wrap">
          <div id="previous" class="previous"></div>
          <div id="display" class="display">0</div>
        </div>

        <div class="button-grid">
          <button class="btn btn-utility" data-action="clear">C</button>
          <button class="btn btn-utility" data-action="delete">DEL</button>
          <button class="btn btn-utility" data-action="percent">%</button>
          <button class="btn btn-operator" data-value="/">÷</button>

          <button class="btn" data-value="7">7</button>
          <button class="btn" data-value="8">8</button>
          <button class="btn" data-value="9">9</button>
          <button class="btn btn-operator" data-value="*">×</button>

          <button class="btn" data-value="4">4</button>
          <button class="btn" data-value="5">5</button>
          <button class="btn" data-value="6">6</button>
          <button class="btn btn-operator" data-value="-">−</button>

          <button class="btn" data-value="1">1</button>
          <button class="btn" data-value="2">2</button>
          <button class="btn" data-value="3">3</button>
          <button class="btn btn-operator" data-value="+">+</button>

          <button class="btn btn-wide" data-value="0">0</button>
          <button class="btn" data-value=".">.</button>
          <button class="btn btn-equals" data-action="equals">=</button>
        </div>
      </section>

      <section class="panel tool-panel">
        <h2>Currency Converter</h2>
        <div class="tool-grid">
          <label>
            Amount
            <input id="currency-amount" type="number" step="0.01" value="100" />
          </label>

          <label>
            From
            <input id="currency-from" list="currency-options" value="USD" placeholder="Search currency" />
          </label>

          <label>
            To
            <input id="currency-to" list="currency-options" value="KES" placeholder="Search currency" />
          </label>
        </div>

        <datalist id="currency-options">
          <option value="USD">USD - US Dollar</option>
          <option value="EUR">EUR - Euro</option>
          <option value="GBP">GBP - British Pound</option>
          <option value="JPY">JPY - Japanese Yen</option>
          <option value="NGN">NGN - Nigerian Naira</option>
          <option value="KES">KES - Kenyan Shilling</option>
          <option value="AED">AED - UAE Dirham</option>
          <option value="AUD">AUD - Australian Dollar</option>
          <option value="CAD">CAD - Canadian Dollar</option>
          <option value="CHF">CHF - Swiss Franc</option>
          <option value="CNY">CNY - Chinese Yuan</option>
          <option value="EGP">EGP - Egyptian Pound</option>
          <option value="GHS">GHS - Ghanaian Cedi</option>
          <option value="HKD">HKD - Hong Kong Dollar</option>
          <option value="INR">INR - Indian Rupee</option>
          <option value="KRW">KRW - South Korean Won</option>
          <option value="MAD">MAD - Moroccan Dirham</option>
          <option value="NOK">NOK - Norwegian Krone</option>
          <option value="SEK">SEK - Swedish Krona</option>
          <option value="SGD">SGD - Singapore Dollar</option>
          <option value="TZS">TZS - Tanzanian Shilling</option>
          <option value="UGX">UGX - Ugandan Shilling</option>
          <option value="ZAR">ZAR - South African Rand</option>
        </datalist>

        <button id="convert-btn" class="action-btn">Convert</button>
        <p id="currency-result" class="tool-result">100 USD = KES 12,950.00</p>
      </section>

      <section class="panel tool-panel">
        <h2>Risk &amp; Lot Size Calculator</h2>
        <div class="tool-grid">
          <label>
            Account size
            <input id="account-size" type="number" step="100" value="1000" />
          </label>

          <label>
            Risk %
            <input id="risk-percent" type="number" step="0.1" value="2" />
          </label>

          <label>
            Stop loss (pips)
            <input id="stop-loss-pips" type="number" step="1" value="30" />
          </label>

          <label>
            Pip value per 1.0 lot
            <input id="pip-value" type="number" step="0.01" value="10" />
          </label>
        </div>

        <button id="risk-btn" class="action-btn">Calculate</button>
        <div class="risk-output">
          <p>Risk amount: <strong id="risk-amount">$0.00</strong></p>
          <p>Lot size: <strong id="lot-size">0.00</strong> lots</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
